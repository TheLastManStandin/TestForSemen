version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    paths:
      - internal/store/postgres/db
      - internal/httpapi/gen
    rules:
      # Test helpers close bodies themselves and use the background context.
      - path: _test\.go
        linters: [bodyclose, noctx]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/TheLastManStandin/TestForSemen
