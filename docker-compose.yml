services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
      POSTGRES_DB: expenses
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://expenses:expenses@postgres:5432/expenses?sslmode=disable
      HTTP_ADDR: ":8080"
      # Interpolated from the shell or the repo-root .env, so `make seed` can override it.
      SEED_DEMO: ${SEED_DEMO:-false}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
