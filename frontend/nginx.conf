server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve the backend on every request so a recreated container is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;

  location = /api/events {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass $backend;
  }

  location = /healthz {
    proxy_pass $backend;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
