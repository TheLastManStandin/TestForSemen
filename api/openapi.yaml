openapi: 3.0.3
info:
  title: Family Expenses API
  version: 1.0.0
  description: REST API веб-панели семейного учёта расходов.
servers:
  - url: /api
paths:
  /members:
    get:
      operationId: listMembers
      summary: Члены семьи
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
  /expenses:
    get:
      operationId: listExpenses
      summary: Список трат с фильтрами
      parameters:
        - { name: member_id, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseList" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createExpense
      summary: Создать трату
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "422": { $ref: "#/components/responses/Problem" }
  /expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getExpense
      summary: Одна трата
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateExpense
      summary: Частично обновить трату
      description: >
        Меняются только переданные поля, остальные остаются как в базе (одновременные правки
        разных полей не теряются). Если передан version и он не совпадает с текущим,
        ничего не записывается и возвращается 409. Запрос без полей (только version или {}) — 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpensePatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteExpense
      summary: Удалить трату
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /stats:
    get:
      operationId: getStats
      summary: Агрегаты для KPI и графиков
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: member_id, in: query, schema: { type: integer, format: int64 } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "422": { $ref: "#/components/responses/Problem" }
  /traces:
    get:
      operationId: listTraces
      summary: Журнал работы агента
      parameters:
        - { name: member_id, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceList" }
  /events:
    get:
      operationId: streamEvents
      summary: "SSE-поток событий: expense.created, expense.updated, expense.deleted"
      responses:
        "200":
          description: Поток Server-Sent Events; data — JSON ExpenseEvent
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ExpenseEvent" }
components:
  responses:
    Problem:
      description: Ошибка (RFC 7807)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Category:
      type: string
      enum: [food, transport, housing, entertainment, health, shopping, other]
    Member:
      type: object
      required: [telegram_id, name]
      properties:
        telegram_id: { type: integer, format: int64 }
        name: { type: string }
    Expense:
      type: object
      required: [id, user_id, member_name, amount, category, spent_at, comment, created_at, updated_at, version]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        member_name: { type: string }
        amount: { type: string, description: "Сумма в рублях, десятичная строка", example: "350.00" }
        category: { $ref: "#/components/schemas/Category" }
        spent_at: { type: string, format: date }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, format: int64, description: "Растёт на 1 при каждом изменении" }
    ExpenseCreate:
      type: object
      required: [user_id, amount, category, spent_at]
      properties:
        user_id: { type: integer, format: int64 }
        amount: { type: string, example: "350.00" }
        category: { $ref: "#/components/schemas/Category" }
        spent_at: { type: string, format: date }
        comment: { type: string }
    ExpensePatch:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        amount: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        spent_at: { type: string, format: date }
        comment: { type: string, description: "Пустая строка очищает комментарий" }
        version:
          type: integer
          format: int64
          description: "Ожидаемая версия траты (из Expense.version); при несовпадении — 409"
    ExpenseList:
      type: object
      required: [items, total, sum]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Expense" }
        total: { type: integer, description: Количество трат по фильтру без учёта пагинации }
        sum: { type: string, description: Сумма трат по фильтру без учёта пагинации }
    Stats:
      type: object
      required: [total, prev_total, count, by_category, by_member, by_day]
      properties:
        total: { type: string }
        prev_total: { type: string, description: Сумма за предыдущий период той же длины }
        count: { type: integer }
        by_category:
          type: array
          items: { $ref: "#/components/schemas/CategoryTotal" }
        by_member:
          type: array
          items: { $ref: "#/components/schemas/MemberTotal" }
        by_day:
          type: array
          items: { $ref: "#/components/schemas/DayTotal" }
    CategoryTotal:
      type: object
      required: [category, total, count]
      properties:
        category: { $ref: "#/components/schemas/Category" }
        total: { type: string }
        count: { type: integer }
    MemberTotal:
      type: object
      required: [user_id, member_name, total, count]
      properties:
        user_id: { type: integer, format: int64 }
        member_name: { type: string }
        total: { type: string }
        count: { type: integer }
    DayTotal:
      type: object
      required: [date, user_id, total]
      properties:
        date: { type: string, format: date }
        user_id: { type: integer, format: int64 }
        total: { type: string }
    TraceStep:
      type: object
      required: [tool, args, result, ms]
      properties:
        tool: { type: string }
        args: {}
        result: {}
        ms: { type: integer, format: int64 }
    Trace:
      type: object
      required: [id, user_id, member_name, source, input, output, steps, model, prompt_tokens, completion_tokens, stt_ms, latency_ms, error, created_at]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        member_name: { type: string }
        source: { type: string, enum: [text, voice] }
        input: { type: string }
        output: { type: string, nullable: true }
        steps:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }
        model: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        stt_ms: { type: integer, nullable: true }
        latency_ms: { type: integer }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    TraceList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Trace" }
        total: { type: integer }
    ExpenseEvent:
      type: object
      required: [type, expense]
      properties:
        type: { type: string, enum: [expense.created, expense.updated, expense.deleted] }
        expense: { $ref: "#/components/schemas/Expense" }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
